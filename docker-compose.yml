services:
  postgres:
    image: postgres:16-alpine
    container_name: sinapse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinapse
      POSTGRES_PASSWORD: sinapse
      POSTGRES_DB: sinapse
    ports:
      - '5432:5432'
    volumes:
      - sinapse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sinapse -d sinapse']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sinapse-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - sinapse-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: sinapse-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI em http://localhost:8025
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  sinapse-postgres:
  sinapse-redis:
